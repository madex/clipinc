name: Release

# Push a tag like v1.14.0 (matching the version in manifest.json) to build the
# extension and publish it as a GitHub release with the zip attached.
on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Check tag matches manifest version
              run: |
                  VERSION=$(node -p "require('./manifest.json').version")
                  if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match manifest version $VERSION"
                      exit 1
                  fi

            - run: npm ci

            - run: npm run build

            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  ZIP="clipinc-$GITHUB_REF_NAME.zip"
                  mv update.zip "$ZIP"
                  gh release create "$GITHUB_REF_NAME" "$ZIP" \
                      --title "clipinc $GITHUB_REF_NAME" \
                      --generate-notes
